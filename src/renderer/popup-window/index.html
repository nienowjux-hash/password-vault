<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Autopreencher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <form id="form-autotype">
      <label>Credencial
        <input
          type="text"
          id="search-credential"
          placeholder="Buscar por nome ou usuário..."
          autocomplete="off"
          autofocus
        />
      </label>
      <div id="folder-chips" class="folder-chips"></div>
      <div id="credential-list" class="credential-listbox" role="listbox" tabindex="-1"></div>
      <label>PIN
        <input type="password" id="input-pin" autocomplete="current-password" />
      </label>
      <p id="error" class="error"></p>
      <div class="actions">
        <button type="button" id="btn-cancel">Cancelar (Esc)</button>
        <button type="submit">Preencher</button>
      </div>
    </form>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
